services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prelegal-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - backend_data:/app/backend
    environment:
      - SECRET_KEY=your-secret-key-change-in-production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prelegal-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
